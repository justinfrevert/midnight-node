[package]
name = "midnight-hyperbridge-probe"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[workspace]

[dependencies]
sp1-sdk = { version = "=6.10.0", default-features = false, features = ["native-gnark"] }
sp1-beefy-primitives = { path = "../../../artifacts/hyperbridge/sp1-beefy/primitives" }
parity-scale-codec = { version = "=3.7.5", features = ["derive"] }
alloy-sol-types = "0.7"
anyhow = "1"
serde_json = "1"
hex = "0.4"
sha2 = "0.10"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
